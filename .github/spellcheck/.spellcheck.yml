matrix:
- name: Markdown
  aspell:
    lang: en
  dictionary:
    wordlists:
    - .github/spellcheck/.wordlist.txt
    encoding: utf-8
  pipeline:
  - pyspelling.filters.markdown:
      markdown_extensions:
        - markdown.extensions.fenced_code
  - pyspelling.filters.html:
      comments: false
      ignores:
        - code
        - pre
        - style
        - script
        - head
        - noscript
        - .hidden
        - .sr-only
        - .copy-button
  sources:
  - '**/*.md|!etcd-v*/**/*|!docs/to-be-deleted/**/*|!docs/content/**/*|!oldocs/**/*'
  default_encoding: utf-8
